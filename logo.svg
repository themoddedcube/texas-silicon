<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Texas Silicon logo">
  <title>Texas Silicon</title>
  <!-- pins -->
  <g fill="#14B8A6">
    <rect x="30" y="6" width="8" height="14" rx="2"/><rect x="48" y="6" width="8" height="14" rx="2"/><rect x="66" y="6" width="8" height="14" rx="2"/><rect x="84" y="6" width="8" height="14" rx="2"/>
    <rect x="30" y="100" width="8" height="14" rx="2"/><rect x="48" y="100" width="8" height="14" rx="2"/><rect x="66" y="100" width="8" height="14" rx="2"/><rect x="84" y="100" width="8" height="14" rx="2"/>
    <rect x="6" y="30" width="14" height="8" rx="2"/><rect x="6" y="48" width="14" height="8" rx="2"/><rect x="6" y="66" width="14" height="8" rx="2"/><rect x="6" y="84" width="14" height="8" rx="2"/>
    <rect x="100" y="30" width="14" height="8" rx="2"/><rect x="100" y="48" width="14" height="8" rx="2"/><rect x="100" y="66" width="14" height="8" rx="2"/><rect x="100" y="84" width="14" height="8" rx="2"/>
  </g>
  <!-- package -->
  <rect x="18" y="18" width="84" height="84" rx="10" fill="#0B1F3A"/>
  <rect x="27" y="27" width="66" height="66" rx="5" fill="none" stroke="#14B8A6" stroke-width="2" opacity=".55"/>
  <!-- monogram -->
  <text x="60" y="71" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#F8FAFC" letter-spacing="1">TS</text>
</svg>
